name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Apply Ruff fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cherryfin/policy/engine.py")
          source = path.read_text()
          old = '''            elif evidence.kind is EvidenceKind.NEWS:
                          if age_seconds > self._settings.max_news_age_hours * 3600:
                              warnings.append(
                                  f"Evidence {evidence.evidence_id} exceeds the configured news "
                                  "freshness window."
                              )
          '''
          new = '''            elif (
                          evidence.kind is EvidenceKind.NEWS
                          and age_seconds > self._settings.max_news_age_hours * 3600
                      ):
                          warnings.append(
                              f"Evidence {evidence.evidence_id} exceeds the configured news "
                              "freshness window."
                          )
          '''
          if old not in source:
              raise SystemExit("Expected policy block was not found")
          path.write_text(source.replace(old, new))
          PY
          ruff check --fix . || true
          ruff format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: apply Ruff fixes"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

services:
  cherryfin-api:
    build: .
    env_file:
      - .env
    environment:
      CHERRYFIN_INTELLIGENCE_STORE_PATH: /var/lib/cherryfin/intelligence.db
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - cherryfin-data:/var/lib/cherryfin
    security_opt:
      - no-new-privileges:true

volumes:
  cherryfin-data:
